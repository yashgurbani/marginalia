<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marginalia settings</title></head><body><main><h1>Excluded sites</h1><p>Marginalia does not capture text on these sites or their subdomains.</p><ul id="sites"></ul><form id="add"><label>Site hostname <input name="hostname" required placeholder="example.org"></label><button>Exclude site</button></form><p id="status" role="status"></p><h2>Local helper</h2><form id="helper-origin-form"><label>HTTP loopback address and port <input id="helper-origin" type="url" required placeholder="http://127.0.0.1:43120"></label><button>Save helper address</button></form><p id="helper-origin-status" role="status"></p></main><script type="module" src="./main.ts"></script></body></html>
