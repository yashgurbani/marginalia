name: Pages

on:
  push:
    branches: [codex/marginalia-v2]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          # The pages reference screenshots at media/... Copy them in if they exist.
          if [ -d marginalia-v2-package/docs/media ]; then
            mkdir -p _site/media
            cp -R marginalia-v2-package/docs/media/. _site/media/
          else
            echo "No marginalia-v2-package/docs/media; screenshot frames stay empty."
          fi
          touch _site/.nojekyll
          ls -R _site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
