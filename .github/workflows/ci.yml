name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: marginalia-v2-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marginalia-v2-package/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run prepare
      - run: npm run extension:typecheck
      - run: npm test
